<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28" fill="none">
  <!-- Outer Dark Shadow/Border for maximum contrast on any background -->
  <g stroke="#05070B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Blade 1 -->
    <path d="M2 2L12 12M12 12L17 17M17 17C17 17 18 19.5 20 19.5C22.2 19.5 24 17.7 24 15.5C24 13.3 22.2 11.5 20 11.5C18.5 11.5 17.5 12.5 17 13" />
    <!-- Blade 2 -->
    <path d="M6 1L12 12M12 12L14 15M14 15C14 15 12 17.5 12 19.5C12 22 13.8 24 16 24C18.2 24 20 22 20 19.5C20 18 19 16.5 17.5 16" />
    <!-- Finger Tang for authentic barber shears -->
    <path d="M24 15.5C25.5 15 27 16 27 17" />
  </g>

  <!-- Polished Gold Metallic Shears -->
  <g stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Sharp Cutting Blade 1 -->
    <path d="M2 2L12 12" stroke="#FFF5D6" stroke-width="2.2" />
    <path d="M12 12L17 17" stroke="#D4AF37" stroke-width="2" />
    <circle cx="20.5" cy="15.5" r="3.5" stroke="url(#goldGrad)" stroke-width="1.8" fill="rgba(11,15,25,0.4)" />
    <!-- Finger rest / tang -->
    <path d="M24 15.5C25.5 15 27 16 27 17" stroke="#E9CE8A" stroke-width="1.6" />

    <!-- Sharp Cutting Blade 2 -->
    <path d="M6 1L12 12" stroke="#E9CE8A" stroke-width="2" />
    <circle cx="16" cy="20" r="3.5" stroke="url(#goldGrad)" stroke-width="1.8" fill="rgba(11,15,25,0.4)" />
  </g>

  <!-- Pivot Screw -->
  <circle cx="12" cy="12" r="2" fill="#FFF2CC" stroke="#8A6D1F" stroke-width="0.8" />
  <circle cx="12" cy="12" r="0.7" fill="#0B0F19" />

  <!-- Blade edge glint highlight -->
  <path d="M2 2L8 8" stroke="#FFFFFF" stroke-width="0.9" stroke-linecap="round" />

  <defs>
    <linearGradient id="goldGrad" x1="2" y1="2" x2="26" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF2CC" />
      <stop offset="30%" stop-color="#E9CE8A" />
      <stop offset="65%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#997722" />
    </linearGradient>
  </defs>
</svg>
